x-kafka-broker: &kafka-broker
  image: apache/kafka:4.3.1
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 15s

# Componentes Java: mesma imagem, muda apenas a classe principal (`command`).
# Dentro da rede do compose os brokers são acessados pelo listener INTERNAL.
x-app: &app
  image: movie-monitor
  env_file: .env
  environment:
    KAFKA_BOOTSTRAP_SERVERS: "broker1:19092,broker2:19092,broker3:19092"
  depends_on:
    topics-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:

  broker1:
    <<: *kafka-broker
    hostname: broker1
    container_name: kafka-broker1

    volumes:
      - broker1-data:/var/lib/kafka/data

    ports:
      - "9092:9092"
      - "9093:9093"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker1:19092,EXTERNAL://localhost:9092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1:9093,2@broker2:9093,3@broker3:9093"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"


  broker2:
    <<: *kafka-broker
    hostname: broker2
    container_name: kafka-broker2

    volumes:
      - broker2-data:/var/lib/kafka/data

    ports:
      - "9094:9092"
      - "9095:9093"

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker2:19092,EXTERNAL://localhost:9094"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1:9093,2@broker2:9093,3@broker3:9093"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"


  broker3:
    <<: *kafka-broker
    hostname: broker3
    container_name: kafka-broker3

    volumes:
      - broker3-data:/var/lib/kafka/data

    ports:
      - "9096:9092"
      - "9097:9093"

    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker3:19092,EXTERNAL://localhost:9096"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1:9093,2@broker2:9093,3@broker3:9093"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"


  # Cria os tópicos e termina (one-shot).
  topics-init:
    image: apache/kafka:4.3.1
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
      broker3:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        BS=broker1:19092,broker2:19092,broker3:19092
        for t in movie-events movie-derived-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists --topic $$t --partitions 3 --replication-factor 3
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --list


  dashboard:
    <<: *app
    build: .
    container_name: movie-dashboard
    command: ["br.ufes.moviemonitor.dashboard.DashboardServer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "broker1:19092,broker2:19092,broker3:19092"
      DASHBOARD_PORT: "8080"
    ports:
      - "8080:8080"

  rating:
    <<: *app
    container_name: movie-rating
    command: ["br.ufes.moviemonitor.consumer.RatingConsumer"]

  popularity:
    <<: *app
    container_name: movie-popularity
    command: ["br.ufes.moviemonitor.consumer.PopularityConsumer"]

  release:
    <<: *app
    container_name: movie-release
    command: ["br.ufes.moviemonitor.consumer.ReleaseConsumer"]

  analyzer:
    <<: *app
    container_name: movie-analyzer
    command: ["br.ufes.moviemonitor.consumer.EventAnalyzer"]

  action:
    <<: *app
    container_name: movie-action
    command: ["br.ufes.moviemonitor.consumer.ActionConsumer"]

  # Sem TMDB_API_KEY o producer aborta; para após 5 tentativas.
  producer:
    <<: *app
    container_name: movie-producer
    command: ["br.ufes.moviemonitor.producer.MovieProducer"]
    restart: on-failure:5


volumes:
  broker1-data:
  broker2-data:
  broker3-data:
